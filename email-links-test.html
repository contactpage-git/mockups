/* LIVE FOOTER (v40): copied from the live cp-vcard footer (kh34363.contact.page): Arial 13.5px, #212121 on #D3D3D3, white
   card with a 1px #757575 border and 18px corners, live icons 18px in #757575. Only the layout differs (one-line address
   + Call, one row of section links, a small row of five mail links). Scoped to .cpf. */
.cpf{padding:24px;font:13.5px/1.6 Arial,sans-serif;color:#212121;background:#D3D3D3;text-align:center}
.cpf *{box-sizing:border-box}
.cpf a{color:inherit;text-underline-offset:2px;text-decoration-color:#757575}
.cpf svg{width:18px;height:18px;fill:#757575;flex:none}
.cpf .footer__card{border:1px solid #757575;border-radius:18px;background:#fff;padding:8px 12px 12px}
.cpf .footer__logo{display:flex;justify-content:center;padding-top:1em}
.cpf .footer__logo img{width:75px;height:75px;display:block}
.cpf .footer__listing-name{margin:0;font-size:16.2px;font-weight:600;padding-top:.5rem;line-height:1.6}
.cpf .footer__listing-category{margin:0;padding-bottom:.5rem}
.cpf .cpf-info{display:flex;justify-content:center;align-items:center;gap:14px;white-space:nowrap;margin:.25em 0 0}
.cpf .cpf-addr{display:inline-flex;align-items:center;gap:6px;min-width:0}
.cpf .cpf-t{overflow:hidden;text-overflow:ellipsis}
.cpf .cpf-call{display:inline-flex;align-items:center;gap:6px;text-decoration:none;flex:none}
.cpf .footer_links{display:flex;justify-content:center;flex-wrap:nowrap;gap:10px;list-style:none;padding:0;margin:.75em 0 0;white-space:nowrap}
.cpf .footer_links a{display:flex;align-items:center;gap:4px}
.counts{max-width:430px;margin:12px auto;font:12px/1.6 Arial,sans-serif;color:#212121}
@media screen and (max-width:360px){.cpf{padding-left:8px;padding-right:8px}}
.cpf{padding-bottom:32px;padding-left:16px;padding-right:16px}
.cpf .cpf-ph{margin:.8em 0 0;text-align:center;font-size:12.5px}
.cpf .cpf-ph a{display:inline-flex;align-items:center;justify-content:center;gap:6px;color:#757575;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:#cfcfcf}
.cpf .cpf-ph svg{width:13px;height:13px;flex:none}.cpf .cpf-ph .ph{fill:#b5b5b5}.cpf .cpf-ph .lk{fill:none;stroke:#b5b5b5;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cpf .cpf-info{display:flex;width:fit-content;max-width:100%;align-items:center;justify-content:center;border:1px solid #d0d0d0;border-radius:12px;padding:11px 12px;margin:.6em auto 0;text-align:center}
.cpf .cpf-addr{display:inline-flex;align-items:center;justify-content:center;gap:6px;max-width:100%;min-width:0}
.cpf .cpf-t{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;min-width:0}
.cpf .cpf-sec,.cpf-out .cpf-mail{display:flex;flex-wrap:wrap;justify-content:center;margin:0;font-size:13.5px;line-height:1.7}
.cpf .cpf-sec{margin:12px auto 0;max-width:100%;font-size:12.5px}.cpf .cpf-sec .mi{margin:0 7px}
.cpf .cpf-sec a,.cpf-out a{color:#757575;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:#b5b5b5}
.cpf .mi{white-space:nowrap;display:inline-flex;align-items:center}.cpf .dt{margin:0 6px;color:#757575}
.cpf-out{margin-top:22px;text-align:center;font:13.5px/1.6 Arial,sans-serif;color:#757575}
.cpf-out .cpf-share{display:flex;justify-content:center;gap:16px;margin:22px 0 0}
.cpf-out .cpf-share a,.cpf-out .cpf-share button{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;padding:0;cursor:pointer}
.cpf-out .cpf-share svg{width:16px;height:16px;fill:#757575}
.cpf-out .cpf-pvs{display:inline-flex;align-items:center;white-space:nowrap;font-size:11.5px}.cpf-out .cpf-pvs .dt{margin:0 4px}
.cpf-out .cpf-share a.cpf-pv{width:auto;height:auto;display:inline;padding:0;font-size:11.5px}
