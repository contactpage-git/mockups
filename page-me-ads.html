<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Internal: page.me ads editor</title>
<style>
body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;max-width:900px;margin:32px auto;padding:0 16px;color:#161616;background:#fff}
h1{font-size:22px;border-left:5px solid #FFC400;padding-left:10px}
p.sub{color:#6f6f6f;font-size:14px}
.toolbar{position:sticky;top:0;background:#fff;padding:12px 0;border-bottom:1px solid #e9e9e9;margin-bottom:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:5}
button{font:600 14px -apple-system,Segoe UI,Roboto,Arial,sans-serif;border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
button.pri{background:#161616;color:#fff;border-color:#161616}
button.danger{color:#c00;border-color:#ecc}
button.small{padding:5px 10px;font-size:13px}
.count{font-size:14px;color:#6f6f6f;margin-left:auto}
.ad{border:1px solid #e9e9e9;border-radius:10px;padding:14px 16px;margin:0 0 12px;background:#fafafa}
.ad .row1{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.ad .n{font-weight:700;color:#8a8a8a;min-width:28px}
.ad .lbl{font-weight:700;font-size:15px;flex:1}
.ad textarea{width:100%;box-sizing:border-box;font:14px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;border:1px solid #ddd;border-radius:8px;padding:8px 10px;resize:vertical;min-height:52px;background:#fff}
.ad .meta{font-size:12px;color:#8a8a8a;margin:6px 0 8px}
.ad .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
a.go{display:inline-block;font-size:14px;background:#25D366;color:#fff;text-decoration:none;padding:8px 16px;border-radius:8px;font-weight:600}
a.go:hover{background:#1eb856}
.link{font-size:12px;color:#8a8a8a;word-break:break-all;margin-top:6px}
.saved{font-size:13px;color:#1a7f37;display:none}
a{color:#161616}
.deleted-note{font-size:14px;color:#6f6f6f;text-align:center;padding:20px}
</style></head>
<body>
<p><a href="index.html">All mockups</a></p>
<h1>Internal: page.me ads editor</h1>
<p class="sub">Edit any prefilled message below &mdash; the WhatsApp link updates live. Delete the duds. Add new ones. Everything saves in this browser automatically. Internal only.</p>
<div class="toolbar">
<button class="pri" id="addBtn">+ Add ad</button>
<button id="resetBtn">Reset to defaults</button>
<span class="saved" id="savedTick">&#10003; saved</span>
<span class="count" id="count"></span>
</div>
<div id="list"></div>
<script>
var DEFAULTS = [{"label": "Get started / @page.me / Reach new customers", "msg": "Hi! Please sign me up for my free website. (ref home signup)", "on": "home-page"}, {"label": "WhatsApp", "msg": "Hi! Please find my business on contact.page, or create my website. (ref home find)", "on": "home-page"}, {"label": "Hire on WhatsApp", "msg": "Hi! I'd like to hire the contact.page agent on WhatsApp (Plus). (ref home plus)", "on": "home-page"}, {"label": "Ask us", "msg": "Hi! I want a featured spot for my business. (ref home featured)", "on": "home-page"}, {"label": "By WhatsApp", "msg": "Hi! I'd like early access to the AI page helper. (ref gate early-access)", "on": "security-page"}, {"label": "Claim / Claim it / Claim this page", "msg": "Hi! I'd like to claim Yellow Tower. (ref kh34363 claim)", "on": "security-page, listing-page, contact-details-page, contact-details-chat"}, {"label": "Edit", "msg": "Hi! I'd like to update Yellow Tower. (ref kh34363 edit)", "on": "security-page"}, {"label": "Remove", "msg": "Hi! I'd like Yellow Tower removed. (ref kh34363 remove)", "on": "security-page"}, {"label": "Report / Report this page", "msg": "Hi! I'd like to report a problem with Yellow Tower. (ref kh34363 report)", "on": "security-page, listing-page"}, {"label": "Help / WhatsApp", "msg": "Hi! I need help with contact.page. (ref kh34363 help)", "on": "security-page, listing-page, contact-details-page, contact-details-chat"}, {"label": "Edit or add contact details", "msg": "Hi! I'd like to update or add contact details for Yellow Tower. (ref kh34363 edit)", "on": "listing-page, contact-details-page, contact-details-chat"}, {"label": "Update address", "msg": "Hi! I'd like to update the address of Yellow Tower. (ref kh34363 update-address)", "on": "listing-page"}, {"label": "Add a question", "msg": "Hi! I'd like to add a FAQ to Yellow Tower. (ref kh34363 add-faq)", "on": "listing-page"}, {"label": "Add photos", "msg": "Hi! I'd like to add photos to Yellow Tower. (ref kh34363 add-photos)", "on": "listing-page"}, {"label": "Edit description", "msg": "Hi! I'd like to update the description of Yellow Tower. (ref kh34363 edit)", "on": "listing-page"}, {"label": "Add or update products", "msg": "Hi! I'd like to add or update offerings on Yellow Tower. (ref kh34363 update-offerings)", "on": "listing-page"}, {"label": "Update facts", "msg": "Hi! I'd like to update the facts on Yellow Tower. (ref kh34363 update-facts)", "on": "listing-page"}, {"label": "Update hours", "msg": "Hi! I'd like to update the opening hours of Yellow Tower. (ref kh34363 update-hours)", "on": "listing-page"}, {"label": "Add or manage your business", "msg": "Hi! I'd like to add or manage my business on contact.page. (ref kh34363 manage)", "on": "listing-page"}, {"label": "Confirm it", "msg": "Hi! The unconfirmed WhatsApp number on Yellow Tower is mine. I'd like to confirm it. (ref kh34363 confirm)", "on": "contact-details-page"}, {"label": "Confirm it", "msg": "Hi! The email yellow.tower.co@gmail.com on Yellow Tower is mine. I'd like to confirm it. (ref kh34363 confirm)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add a contact channel for Yellow Tower. (ref kh34363 add-channel)", "on": "contact-details-page"}, {"label": "@newcustomers (AI)", "msg": "Hi! I can't reach Yellow Tower. (ref kh34363 help)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add the landmark for Yellow Tower. (ref kh34363 add-landmark)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add the floor for Yellow Tower. (ref kh34363 add-floor)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add the entrance for Yellow Tower. (ref kh34363 add-entrance)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add the directions in Khmer for Yellow Tower. (ref kh34363 add-directions)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add the map pin note for Yellow Tower. (ref kh34363 add-pin)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add the languages for Yellow Tower. (ref kh34363 add-languages)", "on": "contact-details-page"}, {"label": "add", "msg": "Hi! I'd like to add the booking link for Yellow Tower. (ref kh34363 add-booking)", "on": "contact-details-page"}, {"label": "By WhatsApp", "msg": "Hi! I'd like early access to the AI page helper. (ref details early-access)", "on": "contact-details-page"}, {"label": "Report this page", "msg": "Hi! I'd like to report a problem with the contact details of Yellow Tower. (ref kh34363 report)", "on": "contact-details-page, contact-details-chat"}, {"label": "WhatsApp", "msg": "Hi! I have a question about privacy on contact.page. (ref privacy help)", "on": "privacy-page"}, {"label": "Start on WhatsApp", "msg": "Hi! I rent out office space in Phnom Penh and want my free site. (ref phnom-penh-office-rental add)", "on": "office-rental-vertical-page"}, {"label": "WhatsApp", "msg": "Hi! I need help with contact.page. (ref phnom-penh-office-rental help)", "on": "office-rental-vertical-page"}];
var KEY = 'pageme-ads-v1';
function load(){ try{ var s = localStorage.getItem(KEY); if(s) return JSON.parse(s); }catch(e){} return JSON.parse(JSON.stringify(DEFAULTS)); }
function save(ads){ localStorage.setItem(KEY, JSON.stringify(ads)); var t=document.getElementById('savedTick'); t.style.display='inline'; clearTimeout(t._h); t._h=setTimeout(function(){t.style.display='none'},1200); }
var ads = load();
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function waLink(msg){ return 'https://wa.me/page.me?text=' + encodeURIComponent(msg); }
function render(){
  var list = document.getElementById('list'); list.innerHTML = '';
  document.getElementById('count').textContent = ads.length + ' ads';
  if(!ads.length){ list.innerHTML = '<div class="deleted-note">All deleted. <button class="small" onclick="resetAll()">Reset to defaults</button></div>'; return; }
  ads.forEach(function(ad, i){
    var d = document.createElement('div'); d.className = 'ad';
    d.innerHTML =
      '<div class="row1"><span class="n">'+(i+1)+'</span><span class="lbl">'+esc(ad.label)+'</span></div>'+
      '<textarea data-i="'+i+'" rows="2">'+esc(ad.msg)+'</textarea>'+
      '<div class="meta">on: '+esc(ad.on||'')+'</div>'+
      '<div class="actions">'+
        '<a class="go" data-go="'+i+'" href="'+waLink(ad.msg)+'" target="_blank" rel="noopener">Open in WhatsApp &#8599;</a>'+
        '<button class="small" data-copy="'+i+'">Copy link</button>'+
        '<button class="small danger" data-del="'+i+'">Delete</button>'+
      '</div>'+
      '<div class="link" data-link="'+i+'">'+esc(waLink(ad.msg))+'</div>';
    list.appendChild(d);
  });
  list.querySelectorAll('textarea').forEach(function(ta){
    ta.addEventListener('input', function(){
      var i = +ta.getAttribute('data-i'); ads[i].msg = ta.value;
      var link = waLink(ta.value);
      list.querySelector('[data-go="'+i+'"]').href = link;
      list.querySelector('[data-link="'+i+'"]').textContent = link;
      save(ads);
    });
  });
  list.querySelectorAll('[data-del]').forEach(function(b){
    b.addEventListener('click', function(){
      if(confirm('Delete this ad?')){ ads.splice(+b.getAttribute('data-del'),1); save(ads); render(); }
    });
  });
  list.querySelectorAll('[data-copy]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = +b.getAttribute('data-copy');
      navigator.clipboard.writeText(waLink(ads[i].msg)).then(function(){ b.textContent='Copied!'; setTimeout(function(){b.textContent='Copy link'},1200); });
    });
  });
}
document.getElementById('addBtn').addEventListener('click', function(){
  ads.unshift({label:'(new)', msg:'Hi! ', on:'new'});
  save(ads); render();
  var first = document.querySelector('#list textarea'); if(first){ first.focus(); }
});
function resetAll(){ ads = JSON.parse(JSON.stringify(DEFAULTS)); save(ads); render(); }
document.getElementById('resetBtn').addEventListener('click', function(){ if(confirm('Reset all ads to defaults? Your edits will be lost.')) resetAll(); });
render();
</script>
</body></html>
