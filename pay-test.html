<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payment test ($1)</title>
<style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:430px;margin:40px auto;padding:0 16px;text-align:center;color:#1a1a1a}h1{font-size:22px}label{display:block;text-align:left;font-weight:700;font-size:14px;margin:0 0 14px}label input{display:block;width:100%;box-sizing:border-box;margin-top:6px;padding:12px;border:1px solid #ccc;border-radius:10px;font:inherit;font-weight:400}label.need input{border-color:#d93025}</style></head>
<body><h1>Payment test ($1)</h1>
<label>Your email<input type="email" id="ppem" required autocomplete="email" inputmode="email" placeholder="you@yourbusiness.com"></label>
<form id="ppf" action="https://www.paypal.com/cgi-bin/webscr" method="post" target="_top"><input type="hidden" name="cmd" value="_s-xclick" /><input type="hidden" name="hosted_button_id" value="64Q9D2TRPSZZU" /><input type="hidden" name="currency_code" value="USD" /><input type="hidden" name="landing_page" value="billing" /><input type="hidden" name="solution_type" value="Sole" /><input type="hidden" name="email" value="" /><input type="image" src="https://www.paypalobjects.com/en_US/i/btn/btn_buynowCC_LG.gif" border="0" name="submit" title="PayPal - The safer, easier way to pay online!" alt="Buy Now" /></form>
<script>(function(){var f=document.getElementById('ppf'),e=document.getElementById('ppem');try{var l=JSON.parse(localStorage.getItem('cp_lead')||'{}');if(l.email)e.value=l.email;}catch(x){}
f.onsubmit=function(){var v=e.value.trim();if(!v||!e.checkValidity()){e.focus();e.parentNode.classList.add('need');return false;}f.elements.email.value=v;try{localStorage.setItem('cp_lead',JSON.stringify({email:v,plan:'test',at:new Date().toISOString()}));}catch(x){}};})();</script>
</body></html>
