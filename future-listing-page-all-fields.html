<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future listing page, every field · contact.page</title>

<style>
:root{--y:#FFC400;--ink:#161616;--mute:#6f6f6f;--line:#e9e9e9;--chip:#f1f2f3}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Arial,Helvetica,sans-serif;border-top:4px solid var(--y)}
.w{max-width:430px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:21px;margin:10px 0 2px;line-height:1.25}
.sub{margin:0;color:var(--mute);font-size:13.5px}
.ctl{position:sticky;top:0;background:#fff;padding:10px 0 8px;margin:8px 0 0;border-bottom:1px solid var(--line);z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid #d0d0d0;border-radius:8px;overflow:hidden}
.seg button{font:600 12.5px Arial;border:0;background:#fff;padding:6px 11px;cursor:pointer;color:var(--ink)}
.seg button[aria-pressed=true]{background:#fffbea;box-shadow:inset 0 -2px var(--y)}
.chk{display:inline-flex;align-items:center;gap:6px;color:var(--mute)}
section.g{margin:22px 0 0}
section.g>h2{font-size:15px;margin:0 0 8px;padding-left:9px;border-left:3px solid var(--y);line-height:1.2}
section.g.priv>h2{border-left-color:#b5b5b5}
.card{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.row{padding:9px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.l{font-size:11.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
.k{display:none;font:11px/1.3 ui-monospace,Menlo,monospace;color:#9a9a9a;margin-top:1px}
.fn .k{display:block}
.v{margin-top:2px}
.v small{color:var(--mute)}
.add{display:inline-block;margin-top:2px;font-size:13px;color:#757575;text-decoration:underline;text-decoration-color:#cfcfcf;text-underline-offset:3px;border:1px dashed #d0d0d0;border-radius:6px;padding:3px 9px;text-decoration:none}
.add:hover{background:#fffbea;border-color:var(--y)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.chip{background:var(--chip);border-radius:5px;height:24px;padding:0 8px;font-size:12px;display:inline-flex;align-items:center}
.lock{color:#E0A500;font-weight:700;font-size:12px}
.priv .row{background:#fafafa}
.only{font-size:11.5px;color:var(--mute);margin:0 0 6px}
body:not(.owner) .priv{display:none}
.ph{display:inline-block;width:92px;height:69px;border-radius:8px;border:1px solid var(--line);background:#f1f2f3;margin:3px 6px 0 0;vertical-align:top}
.row.empty .l::after{content:""}
.foot{margin-top:28px;font-size:12px;color:var(--mute)}
</style>
</head>
<body class="">
<div class="w">
<h1>Example Office Rentals</h1>
<p class="sub">The future listing page: every field of the schema has a place.</p>
<div class="ctl" role="group" aria-label="View">
<span class="seg"><button type="button" data-m="filled" aria-pressed="true">Filled</button><button type="button" data-m="empty" aria-pressed="false">Empty</button></span>
<span class="seg"><button type="button" data-o="0" aria-pressed="true">Visitor</button><button type="button" data-o="1" aria-pressed="false">Owner</button></span>
<label class="chk"><input type="checkbox" id="fn"> Field names</label>
</div>
<div id="out"></div>
<p class="foot">Sample business, fake data. <span id="cnt"></span></p>
</div>
<script>
/* One line per schema field. [group, schema key, number, label, filled value (html) or null, kind]
   kind: "p" public, "g" gated (masked), "o" owner-only private. Sample values only. */
var ID="xx00001", NAME="Example Office Rentals";
var G=[["id","Who they are"],["about","About"],["contact","How to reach them"],["where","Where they are"],["hours","Opening hours"],["media","Photos and files"],["offer","Products and services"],["pay","Payment and prices"],["trust","Trust and registration"],["priv","Only you see this"]];
function chips(a){return '<div class="chips">'+a.map(function(x){return '<span class="chip">'+x+'</span>'}).join('')+'</div>'}
function photos(n){var s='';for(var i=0;i<n;i++)s+='<span class="ph"></span>';return s}
var F=[
["id","name","2","Business name","Example Office Rentals","p"],
["id","legalName","-","Registered name","Example Office Rentals Co., Ltd.","p"],
["id","alternateName","5","Also known as",chips(["Example Offices","EOR"]),"p"],
["id","slogan","4","Slogan","Offices that are ready on day one.","p"],
["id","logo","6","Logo",'<span class="ph" style="width:56px;height:56px"></span>',"p"],
["id","providerType","-","Business or freelancer","Business","p"],
["id","identifier","1","Page code",ID+".contact.page","p"],
["id","foundingDate","78","Founded","2016","p"],
["id","brand","76","Brands we own",chips(["Example Spaces"]),"p"],
["about","description","3","About","Furnished and unfurnished offices and meeting rooms near the river. Flexible leases, one invoice, staff on every floor.","p"],
["about","disambiguatingDescription","-","Short description (160 characters, English)","Furnished offices and meeting rooms near the river, flexible leases.","p"],
["about","translations","-","Short description in other languages",chips(["Khmer","Thai","Bahasa"]),"p"],
["about","primaryCategory / categories","84","Category",chips(["Office rental service","Coworking space","Meeting room rental"]),"p"],
["about","announcements","-","News and offers","<b>Open house</b> Friday 3 pm <small>(until 25 Oct)</small>","p"],
["about","ownerFaq","-","Questions from the owner","<b>Do you rent by the day?</b><br><small>Yes, meeting rooms by the hour, desks by the day.</small>","p"],
["contact","telephone","11","Phone","+855 12 *** ***  <span class=lock>Check to unlock</span>","g"],
["contact","whatsapp","81","WhatsApp","+855 12 *** ***  <span class=lock>Check to unlock</span>","g"],
["contact","messenger","82","Messenger","m.me/*** <span class=lock>Check to unlock</span>","g"],
["contact","email","12","Email","ho***@example.com  <span class=lock>Check to unlock</span>","g"],
["contact","contactPoint[]","13","Departments","Sales: +855 17 *** ***<br>Billing: ac***@example.com","g"],
["contact","contactPoint[].availableLanguage","15","Languages spoken",chips(["English","Khmer","Chinese"]),"p"],
["contact","url","9","Website","example-offices.example","p"],
["contact","sameAs","8","Social profiles",chips(["Facebook","Instagram","LinkedIn","Telegram channel"]),"p"],
["where","address.streetAddress","21","Street","No. 12, Riverside Road","p"],
["where","address.district","-","District","Daun Penh","p"],
["where","address.addressLocality","22","City","Phnom Penh","p"],
["where","address.addressRegion","23","Province","Phnom Penh","p"],
["where","address.postalCode","24","Postal code","12201","p"],
["where","address.addressCountry","25","Country","Cambodia","p"],
["where","geo","26","Map pin","11.5646, 104.9283 <small>(opens our own map page)</small>","p"],
["where","areaServed","29","Areas served",chips(["Phnom Penh","Kandal"]),"p"],
["where","directions.landmark","-","Landmark","Opposite the riverside park","p"],
["where","directions.floor / entrance","-","Floor and entrance","4th floor, side entrance on Street 19","p"],
["where","directions.parking","-","Parking","Underground, 40 bays","p"],
["where","directions.mapPinNote","-","Map pin note","Pin is on the main door","p"],
["where","directions.local","-","Directions in Khmer","ទល់មុខសួនច្បារមាត់ទន្លេ","p"],
["where","timeZone","-","Time zone","Asia/Phnom_Penh","p"],
["hours","openingHoursSpecification","30","Opening hours","Mon-Fri 08:00-18:00<br>Sat 08:00-12:00<br>Sun closed","p"],
["media","image[]","10","Photos",photos(4),"p"],
["media","image[].caption / creditText","38","Photo captions and credits","Lobby, 2026 <small>(photo: Example Studio)</small>","p"],
["media","subjectOf[] albums","34","Albums",chips(["Meeting rooms","Floor plans"]),"p"],
["media","subjectOf[] files","-","Brochures and price lists",chips(["Brochure (PDF)","Floor plans (PDF)"]),"p"],
["offer","makesOffer[].itemOffered","45","Offices and rooms","<b>Private office, 20 m2</b><br><small>Furnished, 6 desks</small>","p"],
["offer","makesOffer[].category / brand / sku","50","Type, brand, code",chips(["Service","Office","SKU-20A"]),"p"],
["offer","makesOffer[].additionalProperty","53","Features",chips(["Air conditioning","Fibre internet","Reception"]),"p"],
["offer","makesOffer[].businessFunction","-","For rent or for sale","For rent (lease)","p"],
["offer","makesOffer[].availability","44","Available","In stock, 3 left","p"],
["pay","makesOffer[].price / priceSpecification","56","Prices","From $450 per month <small>(owner's own price)</small>","p"],
["pay","paymentAccepted","73","Payment methods",chips(["Bank transfer","Cash","QR wallet"]),"p"],
["pay","currenciesAccepted","72","Currencies accepted",chips(["USD","KHR"]),"p"],
["pay","priceRange","74","Price band (hospitality only)",null,"p"],
["trust","verifiedAt","-","Last verified","12 Oct 2026","p"],
["trust","registrationNumber","83","Registration number","00012345","p"],
["trust","registrationStatus","-","Register status","Active (since 2016)","p"],
["trust","isicV4","-","Activity codes",chips(["6820","8211"]),"p"],
["trust","certifications","-","Certifications",chips(["ISO 9001"]),"p"],
["trust","vatID","-","VAT number","K001-123456789","p"],
["trust","employees[]","58","Owner or director","Example Owner, Managing director","p"],
["priv","taxID","80","Tax ID (personal ids never public)","Hidden from everyone but you","o"],
["priv","_registry.directors / nameHistory / addressHistory","-","Register record","Directors, past names, past addresses","o"],
["priv","_registry.filings / employeeCount","-","Filings and staff count","3 filings, 14 staff","o"],
["priv","_verification","85","How we checked you","Phone confirmed 12 Oct, register matched","o"],
["priv","_provenance","88","Where each fact came from","Per-field sources and dates","o"],
["priv","_media_license","87","Photo licences","Owner's own photos, all cleared","o"],
["priv","nextCheckAt","-","Next check due","12 Jan 2027","o"],
["priv","hiddenSections","-","Sections you hid","None. Untick a section to hide it, we never delete.","o"],
["priv","portal / schemaVersion","-","System","portal, schema v2.1","o"]
];
var st={m:"filled",o:0,fn:0};
function wa(l,k){return 'https://wa.me/page.me?text='+encodeURIComponent("Hi! I'd like to add "+l.toLowerCase()+" to "+NAME+". (ref "+ID+" add "+k.split(/[ [\/]/)[0]+")")}
function draw(){
  var h='',n=0;
  G.forEach(function(g){
    var rows=F.filter(function(f){return f[0]===g[0]});
    h+='<section class="g'+(g[0]==="priv"?' priv':'')+'"><h2>'+g[1]+'</h2>'+(g[0]==="priv"?'<p class="only">Only you see this. Never on the public page or in search.</p>':'')+'<div class="card">';
    rows.forEach(function(f){
      n++;var v=f[4],empty=(st.m==="empty"||v===null);
      h+='<div class="row'+(empty?' empty':'')+'"><div class="l">'+f[3]+'</div><div class="k">'+f[1]+(f[2]!=="-"?' · #'+f[2]:'')+'</div><div class="v">'+
        (empty?'<a class="add" href="'+wa(f[3],f[1])+'">Add '+f[3].toLowerCase()+'</a>':v)+'</div></div>';
    });
    h+='</div></section>';
  });
  document.getElementById('out').innerHTML=h;
  document.getElementById('cnt').textContent=F.length+' fields placed, from schema v2.1.';
  document.body.classList.toggle('owner',!!st.o);document.body.classList.toggle('fn',!!st.fn);
  [].forEach.call(document.querySelectorAll('[data-m]'),function(b){b.setAttribute('aria-pressed',b.dataset.m===st.m)});
  [].forEach.call(document.querySelectorAll('[data-o]'),function(b){b.setAttribute('aria-pressed',(b.dataset.o==="1")===!!st.o)});
}
document.querySelector('.ctl').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.m)st.m=b.dataset.m;if(b.dataset.o!==undefined)st.o=+b.dataset.o;draw()});
document.getElementById('fn').addEventListener('change',function(){st.fn=this.checked?1:0;draw()});
draw();
</script>
<div class="endmark" style="text-align:center;color:#c4c4c4;font-size:11px;letter-spacing:2px;margin:28px 0 6px">— end —</div>
<details class="devn" style="color:#9a9a9a;font-size:12px;margin:0 0 8px"><summary style="cursor:pointer;text-align:center;color:#b0b0b0;font-size:11px;list-style-position:inside">Dev notes</summary>

</details>
</body>
</html>
